
name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Step 4: Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # Step 5: Setup CML
      - name: Setup CML
        uses: iterative/setup-cml@v2

      # Step 6: Install dependencies and train model
      - name: Train Model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python train_model.py

      # Step 7: Generate CML report
      - name: Generate Model Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# RF and LR Model Scores" > report.md

          if [ -f scores.txt ]; then
            cat scores.txt >> report.md
          else
            echo "Error: scores.txt was not generated." >> report.md
            exit 1
          fi

          echo "" >> report.md
          echo "## Model Visualizations" >> report.md
          echo "Confusion Matrix and Feature Importance images are available in the Artifacts section of this workflow run." >> report.md

          cml comment create report.md

      # Step 8: Upload results
      - name: Upload Model Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: warn
          retention-days: 30
