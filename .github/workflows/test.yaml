
name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 3. Setup Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # 4. Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # 5. Setup CML
      - name: Setup CML
        uses: iterative/setup-cml@v2

      # 6. Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Train model
      - name: Train Model
        run: |
          python train_model.py

      # 8. Generate model report
      - name: Generate Model Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f scores.txt ]; then
            echo "Error: scores.txt not found!"
            exit 1
          fi

          echo "# RF and LR Model Scores" > report.md
          echo "" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Model Visualizations" >> report.md
          echo "Confusion Matrix and Feature Importance are available in the workflow artifacts." >> report.md

          cml comment create report.md

      # 9. Upload model results
      - name: Upload Model Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-results
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: warn
          retention-days: 30
