
name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create Results Directory
        run: |
          mkdir -p results
          echo "Model training started." > results/status.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        id: training
        continue-on-error: true
        run: |
          python train_model.py

      - name: Collect Model Results
        if: always()
        run: |
          mkdir -p results

          find . -maxdepth 4 -type f \
            \( -name "scores.txt" \
            -o -name "ConfusionMatrix.png" \
            -o -name "FeatureImportance.png" \) \
            -not -path "./results/*" \
            -not -path "./.git/*" \
            -exec cp -t results/ {} +

          echo "Model training completed." > results/status.txt

          echo "Available files:"
          ls -lh results/

      - name: Generate Model Report
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Model Training Report"
            echo ""
            echo "## Training Results"
            echo ""

            if [ -f results/scores.txt ]; then
              cat results/scores.txt
            else
              echo "No scores.txt generated."
            fi

            echo ""
            echo "## Generated Files"
            ls -1 results/
          } > results/report.md

      - name: Upload Model Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-results
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Check Training Status
        if: always() && steps.training.outcome == 'failure'
        run: |
          echo "Model training failed. Check the Train Model logs."
          exit 1
